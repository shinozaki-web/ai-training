<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新しいパスワードを設定 — AI業務改善研修</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding-bottom:0; display:flex; flex-direction:column; justify-content:center; min-height:100vh; }
  .auth-wrap { padding:32px 24px; max-width:420px; margin:0 auto; width:100%; }
  .auth-heading { text-align:center; margin-bottom:24px; }
  .auth-heading .icon { font-size:40px; margin-bottom:10px; }
  .auth-heading h1 { font-size:20px; font-weight:800; }
  .auth-heading p { color:var(--text-muted); font-size:13px; line-height:1.7; margin-top:8px; }
  .help { color:var(--text-muted); font-size:12px; line-height:1.6; margin-top:-7px; margin-bottom:16px; }
  .message { display:none; border-radius:10px; font-size:13px; line-height:1.7; margin-top:14px; padding:12px; }
  .message.success { display:block; color:#065f46; background:#d1fae5; }
  .message.error { display:block; color:#991b1b; background:#fee2e2; }
  .back-link { display:block; text-align:center; color:var(--primary); font-size:13px; font-weight:700; margin-top:18px; text-decoration:none; }
  #password-form { display:none; }
</style>
<script>
const recoveryLinkPresent =
  new URLSearchParams(location.hash.slice(1)).get('type') === 'recovery' ||
  new URLSearchParams(location.search).get('type') === 'recovery';
</script>
</head>
<body>
<main class="auth-wrap">
  <div class="auth-heading">
    <div class="icon">🔐</div>
    <h1>新しいパスワードを設定</h1>
    <p id="intro">再設定リンクを確認しています...</p>
  </div>
  <form class="card" id="password-form">
    <div class="form-group">
      <label for="new-password">新しいパスワード</label>
      <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="confirm-password">新しいパスワード（確認）</label>
      <input type="password" id="confirm-password" required minlength="8" autocomplete="new-password">
    </div>
    <div class="help">8文字以上で設定してください。</div>
    <button class="btn btn-primary" id="update-btn" type="submit">パスワードを変更する</button>
    <div class="message" id="message" role="status"></div>
  </form>
  <div class="message" id="link-error" role="alert"></div>
  <a class="back-link" href="index.html">ログイン画面へ戻る</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<script>
const form = document.getElementById('password-form');
const intro = document.getElementById('intro');
const linkError = document.getElementById('link-error');
let recoveryReady = false;

function showRecoveryForm() {
  if (recoveryReady) return;
  recoveryReady = true;
  intro.textContent = '新しいパスワードを入力してください。';
  form.style.display = 'block';
  linkError.className = 'message';
}

function showLinkError() {
  if (recoveryReady) return;
  intro.textContent = '再設定リンクを確認できませんでした。';
  linkError.className = 'message error';
  linkError.textContent = 'リンクの有効期限が切れているか、すでに使用されています。ログイン画面から再設定メールを送り直してください。';
}

const hashParams = new URLSearchParams(location.hash.slice(1));
if (hashParams.get('error')) {
  showLinkError();
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' && session) showRecoveryForm();
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && recoveryLinkPresent) {
    showRecoveryForm();
    return;
  }
  setTimeout(showLinkError, 1500);
})();

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!recoveryReady) return;
  const password = document.getElementById('new-password').value;
  const confirmation = document.getElementById('confirm-password').value;
  const button = document.getElementById('update-btn');
  const message = document.getElementById('message');
  message.className = 'message';
  message.textContent = '';

  if (password.length < 8) {
    message.className = 'message error';
    message.textContent = 'パスワードは8文字以上で入力してください。';
    return;
  }
  if (password !== confirmation) {
    message.className = 'message error';
    message.textContent = '確認用パスワードが一致しません。';
    return;
  }

  button.disabled = true;
  button.textContent = '変更中...';
  const { error } = await sb.auth.updateUser({ password });
  if (error) {
    message.className = 'message error';
    message.textContent = 'パスワードを変更できませんでした。別のパスワードをお試しください。';
    button.disabled = false;
    button.textContent = 'パスワードを変更する';
    return;
  }

  await sb.auth.signOut();
  document.getElementById('new-password').value = '';
  document.getElementById('confirm-password').value = '';
  message.className = 'message success';
  message.textContent = 'パスワードを変更しました。ログイン画面から新しいパスワードでログインしてください。';
  button.textContent = '変更しました';
});
</script>
</body>
</html>
