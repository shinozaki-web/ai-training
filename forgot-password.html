<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワード再設定 — AI業務改善研修</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding-bottom:0; display:flex; flex-direction:column; justify-content:center; min-height:100vh; }
  .auth-wrap { padding:32px 24px; max-width:420px; margin:0 auto; width:100%; }
  .auth-heading { text-align:center; margin-bottom:24px; }
  .auth-heading .icon { font-size:40px; margin-bottom:10px; }
  .auth-heading h1 { font-size:20px; font-weight:800; }
  .auth-heading p { color:var(--text-muted); font-size:13px; line-height:1.7; margin-top:8px; }
  .message { display:none; border-radius:10px; font-size:13px; line-height:1.7; margin-top:14px; padding:12px; }
  .message.success { display:block; color:#065f46; background:#d1fae5; }
  .message.error { display:block; color:#991b1b; background:#fee2e2; }
  .back-link { display:block; text-align:center; color:var(--primary); font-size:13px; font-weight:700; margin-top:18px; text-decoration:none; }
</style>
</head>
<body>
<main class="auth-wrap">
  <div class="auth-heading">
    <div class="icon">🔑</div>
    <h1>パスワードを再設定</h1>
    <p>登録されているメールアドレスへ、パスワード再設定用のリンクを送ります。</p>
  </div>
  <form class="card" id="reset-request-form">
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" required autocomplete="email" placeholder="example@company.com">
    </div>
    <button class="btn btn-primary" id="send-btn" type="submit">再設定メールを送る</button>
    <div class="message" id="message" role="status"></div>
  </form>
  <a class="back-link" href="index.html">ログイン画面へ戻る</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<script>
document.getElementById('reset-request-form').addEventListener('submit', async event => {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();
  const button = document.getElementById('send-btn');
  const message = document.getElementById('message');
  button.disabled = true;
  button.textContent = '送信中...';
  message.className = 'message';
  message.textContent = '';

  const redirectTo = new URL('reset-password.html', location.href).href;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
  if (error) {
    message.className = 'message error';
    message.textContent = '送信できませんでした。時間をおいてもう一度お試しください。';
    button.disabled = false;
    button.textContent = '再設定メールを送る';
    return;
  }

  message.className = 'message success';
  message.textContent = '該当するアカウントがある場合、再設定メールを送信しました。メール内のリンクを開いてください。';
  button.textContent = '送信しました';
});
</script>
</body>
</html>
