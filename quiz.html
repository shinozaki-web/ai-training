<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クイズ — AI業務改善研修</title>
<link rel="stylesheet" href="style.css">
<style>
  .quiz-progress {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 16px;
  }
  .question-text {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.55;
    margin-bottom: 20px;
  }
  .result-card {
    text-align: center;
    padding: 32px 20px;
  }
  .result-score {
    font-size: 56px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
    margin-bottom: 8px;
  }
  .result-label { font-size: 15px; color: var(--text-muted); margin-bottom: 20px; }
  .badge-award {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
    color: white;
    margin-bottom: 16px;
  }
  .badge-award .icon { font-size: 52px; margin-bottom: 8px; }
  .badge-award h3 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .badge-award p { font-size: 13px; opacity: 0.85; }
</style>
</head>
<body>
<div class="page-header">
  <h1 id="quiz-title">確認クイズ</h1>
  <div class="subtitle" id="quiz-subtitle"></div>
</div>

<div class="main" id="main-content">
  <div class="card" style="text-align:center; color:var(--text-muted); padding:24px;">読み込み中...</div>
</div>

<div id="toast" class="toast"></div>

<nav class="bottom-nav">
  <a href="home.html"><span class="icon">🏠</span>ホーム</a>
  <a href="curriculum.html"><span class="icon">📚</span>カリキュラム</a>
  <a href="badges.html"><span class="icon">🏅</span>バッジ</a>
  <a href="https://docs.google.com/forms/d/e/1FAIpQLSfgvJgIQx7TXhz0vgRCp4QrfAa9bC9iNfWtCnQSBp2wyUutDg/viewform" target="_blank" rel="noopener noreferrer"><span class="icon">💬</span>ご要望</a>
</nav>

<script src="local-store.js"></script>
<script src="data/lessons.js"></script>
<script src="data/quizzes.js"></script>
<script>
let moduleId, currentModule, questions;
let currentQ = 0;
let score = 0;
let answered = false;
let shuffledOptions = [];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function shuffleOptions(q) {
  const indices = [0, 1, 2, 3];
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  return {
    options: indices.map(i => q.options[i]),
    correctIndex: indices.indexOf(q.answer)
  };
}

function renderQuestion() {
  const q = questions[currentQ];
  const { options, correctIndex } = shuffleOptions(q);
  shuffledOptions = options;

  document.getElementById('quiz-subtitle').textContent = (currentQ + 1) + ' / ' + questions.length;
  answered = false;

  const main = document.getElementById('main-content');
  main.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';

  const prog = document.createElement('div');
  prog.className = 'quiz-progress';
  prog.textContent = 'Q' + (currentQ + 1) + ' / ' + questions.length;

  const qText = document.createElement('div');
  qText.className = 'question-text';
  qText.textContent = q.q;

  card.append(prog, qText);

  options.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'quiz-option';

    const circle = document.createElement('div');
    circle.style.cssText = 'width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:var(--text-muted);';
    circle.textContent = ['A','B','C','D'][i];

    const label = document.createElement('span');
    label.style.cssText = 'font-size:14px; line-height:1.5;';
    label.textContent = opt;

    btn.append(circle, label);

    btn.onclick = () => {
      if (answered) return;
      answered = true;

      const isCorrect = i === correctIndex;
      if (isCorrect) {
        score++;
        btn.classList.add('correct');
        showToast('正解！ ✅');
      } else {
        btn.classList.add('wrong');
        // 正解を強調
        card.querySelectorAll('.quiz-option')[correctIndex].classList.add('correct');
        showToast('不正解… 正解はABCDの' + ['A','B','C','D'][correctIndex] + 'でした');
      }

      setTimeout(() => {
        currentQ++;
        if (currentQ < questions.length) {
          renderQuestion();
        } else {
          saveAndShowResult();
        }
      }, 1200);
    };

    card.appendChild(btn);
  });

  main.appendChild(card);
}

function saveAndShowResult() {
  const total = questions.length;

  trainingStore.saveQuizResult(moduleId, score, total);

  // バッジ付与（スコアに関係なく初回完了で付与）
  const badgeId = currentModule.badge.id;
  trainingStore.awardBadge(badgeId);

  // 全バッジ確認 → 修了証バッジ付与
  const earnedIds = new Set(Object.keys(trainingStore.getBadges()));
  const allModuleBadges = MODULES.every(m => earnedIds.has(m.badge.id));
  if (allModuleBadges) {
    trainingStore.awardBadge('complete');
  }

  renderResult(score, total, badgeId);
}

function renderResult(score, total, badgeId) {
  document.getElementById('quiz-subtitle').textContent = '結果';

  const main = document.getElementById('main-content');
  main.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card result-card';

  const scoreEl = document.createElement('div');
  scoreEl.className = 'result-score';
  scoreEl.textContent = score + ' / ' + total;

  const label = document.createElement('div');
  label.className = 'result-label';
  label.textContent = score === total ? '満点！素晴らしい！' : (score >= Math.ceil(total / 2) ? 'よくできました！' : 'もう一度復習してみましょう');

  card.append(scoreEl, label);
  main.appendChild(card);

  // バッジ獲得演出
  const badge = currentModule.badge;
  const badgeDiv = document.createElement('div');
  badgeDiv.className = 'badge-award';

  const iconDiv = document.createElement('div');
  iconDiv.className = 'icon';
  iconDiv.textContent = badge.icon;

  const h3 = document.createElement('h3');
  h3.textContent = '「' + badge.label + '」バッジ獲得！';

  const p = document.createElement('p');
  p.textContent = 'モジュール' + moduleId + 'を修了しました 🎉';

  badgeDiv.append(iconDiv, h3, p);
  main.appendChild(badgeDiv);

  // 次のモジュールへ or カリキュラムへ
  const nextModule = MODULES.find(m => m.id === moduleId + 1);
  const btn = document.createElement('button');
  btn.className = 'btn btn-primary';
  if (nextModule) {
    btn.textContent = '次のモジュールへ →';
    btn.onclick = () => { location.href = 'lesson.html?module=' + nextModule.id; };
  } else {
    btn.textContent = '修了証を確認する 🏆';
    btn.onclick = () => { location.href = 'badges.html'; };
  }
  main.appendChild(btn);

  const backBtn = document.createElement('button');
  backBtn.className = 'btn btn-outline';
  backBtn.style.marginTop = '10px';
  backBtn.textContent = 'カリキュラム一覧へ戻る';
  backBtn.onclick = () => { location.href = 'curriculum.html'; };
  main.appendChild(backBtn);
}

(function () {
  const params = new URLSearchParams(location.search);
  moduleId = parseInt(params.get('module'));
  currentModule = MODULES.find(m => m.id === moduleId);
  questions = QUIZZES[moduleId];

  if (!currentModule || !questions) { location.href = 'curriculum.html'; return; }

  document.getElementById('quiz-title').textContent = currentModule.title + ' — クイズ';
  renderQuestion();
})();
</script>
</body>
</html>
