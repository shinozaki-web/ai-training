<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>改善リクエスト — AI業務改善研修</title>
<link rel="stylesheet" href="style.css">
<style>
  .intro { margin-bottom: 16px; }
  .intro h2 { font-size: 17px; margin-bottom: 6px; }
  .intro p, .help { color: var(--text-muted); font-size: 13px; line-height: 1.7; }
  .status { display:none; margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 13px; line-height: 1.6; }
  .status.success { display:block; color:#065f46; background:#d1fae5; }
  .status.error { display:block; color:#991b1b; background:#fee2e2; }
  .history { margin-top: 24px; }
  .section-title { font-size:13px; font-weight:700; color:var(--text-muted); margin:20px 0 12px; }
  .request { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .request:last-child { border-bottom: 0; }
  .request-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .request-title { font-size:14px; font-weight:700; }
  .request-meta { margin-top:5px; color:var(--text-muted); font-size:11px; }
  .pill { flex-shrink:0; border-radius:999px; padding:4px 8px; font-size:10px; font-weight:700; background:#e2e8f0; }
  .pill.pending { background:#fef3c7; color:#92400e; }
  .pill.implementing { background:#dbeafe; color:#1e40af; }
  .pill.in_review, .pill.completed { background:#d1fae5; color:#065f46; }
</style>
</head>
<body>
<div class="page-header">
  <h1>💬 改善リクエスト</h1>
  <div class="subtitle">気づいたことを運営へ直接届けられます</div>
</div>
<main class="main">
  <section class="card intro">
    <h2>より良い研修にするために</h2>
    <p>不具合、使いにくい点、追加してほしい講座を教えてください。送信内容は運営が確認し、承認されたものから改善します。</p>
  </section>
  <form class="card" id="feedback-form">
    <div class="form-group">
      <label for="category">種類</label>
      <select id="category" required>
        <option value="bug">不具合</option>
        <option value="improvement">機能・使いやすさの改善</option>
        <option value="content">講座内容の追加・拡充</option>
      </select>
    </div>
    <div class="form-group">
      <label for="title">ひとことで</label>
      <input id="title" maxlength="120" required placeholder="例：クイズの次へボタンが押せない">
    </div>
    <div class="form-group">
      <label for="description">詳しい内容</label>
      <textarea id="description" maxlength="4000" required placeholder="何をしていたときに、何が起きたか／どうなると嬉しいか"></textarea>
      <div class="help">個人情報やパスワードは入力しないでください。</div>
    </div>
    <button class="btn btn-primary" id="submit-btn" type="submit">運営に送信する</button>
    <div class="status" id="status" role="status"></div>
  </form>
  <section class="history">
    <div class="section-title">送信したリクエスト</div>
    <div class="card" id="history"><div class="empty-state">読み込み中...</div></div>
  </section>
</main>
<nav class="bottom-nav">
  <a href="home.html"><span class="icon">🏠</span>ホーム</a>
  <a href="curriculum.html"><span class="icon">📚</span>カリキュラム</a>
  <a href="badges.html"><span class="icon">🏅</span>バッジ</a>
  <a href="feedback.html" class="active"><span class="icon">💬</span>改善</a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<script>
const labels = {
  pending: '確認待ち', implementing: '実装中', in_review: '確認中',
  completed: '対応済み', rejected: '見送り', failed: '要再確認'
};

async function requireSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'index.html'; throw new Error('ログインが必要です'); }
  return session;
}

async function loadHistory() {
  await requireSession();
  const { data, error } = await sb.from('feedback_requests')
    .select('id, title, category, status, pull_request_url, created_at')
    .order('created_at', { ascending: false });
  const box = document.getElementById('history');
  box.replaceChildren();
  if (error) { box.textContent = '履歴を読み込めませんでした。'; return; }
  if (!data?.length) { box.textContent = 'まだ送信したリクエストはありません。'; return; }
  data.forEach(item => {
    const row = document.createElement('div');
    row.className = 'request';
    const top = document.createElement('div');
    top.className = 'request-top';
    const title = document.createElement('div');
    title.className = 'request-title';
    title.textContent = item.title;
    const status = document.createElement('span');
    status.className = 'pill ' + item.status;
    status.textContent = labels[item.status] || item.status;
    const meta = document.createElement('div');
    meta.className = 'request-meta';
    meta.textContent = new Date(item.created_at).toLocaleString('ja-JP');
    top.append(title, status);
    row.append(top, meta);
    box.appendChild(row);
  });
}

document.getElementById('feedback-form').addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('submit-btn');
  const status = document.getElementById('status');
  button.disabled = true;
  status.className = 'status';
  try {
    const session = await requireSession();
    const { error } = await sb.functions.invoke('feedback-submit', {
      headers: { Authorization: `Bearer ${session.access_token}` },
      body: {
        category: document.getElementById('category').value,
        title: document.getElementById('title').value.trim(),
        description: document.getElementById('description').value.trim(),
        page_url: location.href
      }
    });
    if (error) {
      let code = '';
      try {
        const payload = await error.context.json();
        code = payload?.error || '';
      } catch (_) {}
      throw new Error(code);
    }
    event.target.reset();
    status.className = 'status success';
    status.textContent = '送信しました。運営に通知されました。';
    await loadHistory();
  } catch (error) {
    status.className = 'status error';
    const messages = {
      Unauthorized: 'ログイン情報の有効期限が切れました。ログインし直してください。',
      'Invalid input': '入力内容を確認してください。',
      'Profile not found': '受講者プロフィールが見つかりません。',
      'Company not assigned': '受講者プロフィールに会社が設定されていません。',
      'Profile lookup failed': 'プロフィールを読み込めませんでした。運営へお知らせください。'
    };
    status.textContent = messages[error.message] || '送信できませんでした。時間をおいてもう一度お試しください。';
  } finally {
    button.disabled = false;
  }
});

loadHistory();
</script>
</body>
</html>
