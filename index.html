<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI業務改善研修</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding-bottom: 0; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
  .login-wrap { padding: 32px 24px; max-width: 420px; margin: 0 auto; width: 100%; }
  .login-logo { text-align: center; margin-bottom: 36px; }
  .login-logo .logo-mark { font-size: 48px; margin-bottom: 12px; }
  .login-logo h1 { font-size: 20px; font-weight: 800; }
  .login-logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-mark">🤖</div>
    <h1>AI業務改善研修</h1>
    <p>門司港プログラミング教室</p>
  </div>
  <div class="card">
    <div class="form-group">
      <label>メールアドレス</label>
      <input type="email" id="email" placeholder="example@company.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="password" placeholder="パスワードを入力" autocomplete="current-password">
    </div>
    <p class="error-msg" id="error-msg"></p>
    <button class="btn btn-primary" id="login-btn" style="margin-top:8px;">ログイン</button>
  </div>
  <p style="text-align:center; font-size:12px; color:var(--text-muted); margin-top:20px;">
    IDとパスワードは担当者からお知らせします
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<script>
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { location.href = 'home.html'; return; }
})();

document.getElementById('login-btn').onclick = async () => {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl    = document.getElementById('error-msg');
  const btn      = document.getElementById('login-btn');

  errEl.style.display = 'none';
  btn.textContent = 'ログイン中...';
  btn.disabled = true;

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = 'メールアドレスまたはパスワードが正しくありません';
    errEl.style.display = 'block';
    btn.textContent = 'ログイン';
    btn.disabled = false;
    return;
  }
  location.href = 'home.html';
};

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});
</script>
</body>
</html>
