<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI業務改善研修</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding-bottom: 0; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
  .login-wrap { padding: 32px 24px; max-width: 420px; margin: 0 auto; width: 100%; }
  .login-logo { text-align: center; margin-bottom: 36px; }
  .login-logo .logo-mark { font-size: 48px; margin-bottom: 12px; }
  .login-logo h1 { font-size: 20px; font-weight: 800; }
  .login-logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
  .start-note { color:var(--text-muted); font-size:13px; line-height:1.7; margin-bottom:18px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-mark">🤖</div>
    <h1>AI業務改善研修</h1>
  </div>
  <div class="card">
    <p class="start-note">ログインは不要です。学習進捗はこのブラウザ内に保存されます。</p>
    <div class="form-group">
      <label>お名前（任意）</label>
      <input type="text" id="name" placeholder="受講者" maxlength="60" autocomplete="name">
    </div>
    <div class="form-group">
      <label>会社名（任意）</label>
      <input type="text" id="company" placeholder="会社名" maxlength="100" autocomplete="organization">
    </div>
    <button class="btn btn-primary" id="start-btn" style="margin-top:8px;">研修を始める</button>
  </div>
  <p style="text-align:center; font-size:12px; color:var(--text-muted); margin-top:20px;">
    別の端末やブラウザには進捗が引き継がれません
  </p>
</div>

<script src="local-store.js"></script>
<script>
const profile = trainingStore.getProfile();
if (profile.name !== '受講者') document.getElementById('name').value = profile.name;
document.getElementById('company').value = profile.company || '';

document.getElementById('start-btn').onclick = () => {
  trainingStore.setProfile({
    name: document.getElementById('name').value.trim() || '受講者',
    company: document.getElementById('company').value.trim()
  });
  location.href = 'home.html';
};
</script>
</body>
</html>
