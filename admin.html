<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 — AI業務改善研修</title>
<link rel="stylesheet" href="style.css">
<style>
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
  .stat-card .num { font-size: 32px; font-weight: 800; color: var(--primary); }
  .stat-card .lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
  .member-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .member-row:last-child { border-bottom: none; }
  .member-avatar { width: 36px; height: 36px; background: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: var(--text-muted); flex-shrink: 0; }
  .member-info { flex: 1; min-width: 0; }
  .member-info .name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .member-info .meta { font-size: 12px; color: var(--text-muted); }
  .member-prog { font-size: 12px; font-weight: 700; color: var(--primary); flex-shrink: 0; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); margin: 20px 0 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .feedback-card { margin-bottom:12px; }
  .feedback-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .feedback-title { font-size:15px; font-weight:800; }
  .feedback-meta { color:var(--text-muted); font-size:11px; margin-top:5px; }
  .feedback-body { white-space:pre-wrap; font-size:13px; line-height:1.7; margin:12px 0; overflow-wrap:anywhere; }
  .feedback-label { color:var(--text-muted); font-size:11px; font-weight:800; letter-spacing:.04em; margin-bottom:6px; }
  .feedback-original { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px; margin:12px 0; }
  .feedback-original .feedback-title { font-size:14px; }
  .feedback-original .feedback-body { margin:8px 0 0; }
  .feedback-editor { border:2px solid #bfdbfe; background:#eff6ff; border-radius:14px; padding:14px; margin:12px 0; }
  .feedback-editor-title { color:#1e40af; font-size:14px; font-weight:800; margin-bottom:4px; }
  .feedback-editor-help { color:#475569; font-size:12px; line-height:1.6; margin-bottom:12px; }
  .feedback-editor label { display:block; color:#334155; font-size:12px; font-weight:800; margin:10px 0 6px; }
  .feedback-editor input, .feedback-editor textarea { width:100%; box-sizing:border-box; }
  .feedback-editor textarea { min-height:150px; resize:vertical; }
  .feedback-approved { border-left:4px solid #22c55e; background:#f0fdf4; border-radius:10px; padding:12px; margin:12px 0; }
  .feedback-approved .feedback-title { font-size:14px; }
  .feedback-approved .feedback-body { margin:8px 0 0; }
  .feedback-action-status { min-height:18px; color:#b91c1c; font-size:12px; margin-top:8px; }
  .feedback-actions { display:grid; grid-template-columns:2fr 1fr; gap:8px; }
  .feedback-actions .btn { padding:10px 12px; font-size:13px; }
  .type-pill { border-radius:999px; padding:4px 8px; background:#e2e8f0; color:#475569; font-size:10px; font-weight:700; flex-shrink:0; }
  .status-link { display:inline-block; color:var(--primary); font-size:12px; font-weight:700; margin-top:8px; }
  .invite-url-box { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px; font-size:12px; word-break:break-all; color:var(--text); margin:10px 0; }
</style>
</head>
<body>
<div class="page-header">
  <h1>管理画面</h1>
  <div class="subtitle" id="company-name">読み込み中...</div>
</div>

<div class="main">
  <div class="stat-grid" id="stat-grid">
    <div class="stat-card"><div class="num">-</div><div class="lbl">メンバー数</div></div>
    <div class="stat-card"><div class="num">-</div><div class="lbl">平均進捗</div></div>
    <div class="stat-card"><div class="num">-</div><div class="lbl">修了者</div></div>
    <div class="stat-card"><div class="num">-</div><div class="lbl">アンケート回答</div></div>
  </div>

  <div class="section-title">招待リンク</div>
  <div class="card" id="invite-section" style="padding:16px;">
    <div style="text-align:center; color:var(--text-muted); padding:8px; font-size:14px;">読み込み中...</div>
  </div>

  <div class="section-title">メンバー進捗</div>
  <div class="card" id="member-list">
    <div style="text-align:center; color:var(--text-muted); padding:16px;">読み込み中...</div>
  </div>

  <div class="section-title">改善リクエスト</div>
  <div id="feedback-list">
    <div class="card empty-state">読み込み中...</div>
  </div>

  <div style="margin-top:24px;">
    <button class="btn btn-outline" id="logout-btn">ログアウト</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<script src="data/lessons.js"></script>
<script>
const TOTAL_SECTIONS = MODULES.reduce((sum, m) => sum + m.sections.length, 0);

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }
  const uid = session.user.id;

  // 管理者確認
  const { data: me } = await sb.from('profiles').select('name, is_admin, company_id, companies(name)').eq('id', uid).maybeSingle();
  if (!me || !me.is_admin) { location.href = 'home.html'; return; }

  document.getElementById('company-name').textContent = me.companies?.name ?? '';

  await Promise.all([loadInvite(me.company_id), loadFeedback(me.company_id)]);

  // 同社メンバー取得
  const { data: members } = await sb.from('profiles').select('id, name, is_admin').eq('company_id', me.company_id);
  const regularMembers = (members || []).filter(m => !m.is_admin);

  // 進捗取得
  const memberIds = regularMembers.map(m => m.id);
  const { data: progress } = await sb.from('section_progress').select('user_id, module_id').in('user_id', memberIds);
  const { data: surveys } = await sb.from('survey_responses').select('user_id').in('user_id', memberIds);
  const { data: allBadges } = await sb.from('user_badges').select('user_id, badge_id').in('user_id', memberIds);

  // 集計
  const progressByUser = {};
  (progress || []).forEach(p => {
    if (!progressByUser[p.user_id]) progressByUser[p.user_id] = new Set();
    progressByUser[p.user_id].add(p.module_id + '-' + p.module_id);
  });

  // モジュール完了数（バッジ獲得 = モジュール完了とみなす）
  const modulesBadgeByUser = {};
  (allBadges || []).forEach(b => {
    if (!modulesBadgeByUser[b.user_id]) modulesBadgeByUser[b.user_id] = 0;
    if (b.badge_id !== 'complete') modulesBadgeByUser[b.user_id]++;
  });

  const surveySet = new Set((surveys || []).map(s => s.user_id));
  const completedUsers = regularMembers.filter(m => (modulesBadgeByUser[m.id] || 0) >= MODULES.length);
  const totalProgress = regularMembers.reduce((sum, m) => sum + (modulesBadgeByUser[m.id] || 0), 0);
  const avgProgress = regularMembers.length > 0 ? Math.round((totalProgress / (regularMembers.length * MODULES.length)) * 100) : 0;

  // 統計カード更新
  const statGrid = document.getElementById('stat-grid');
  const nums = statGrid.querySelectorAll('.num');
  const lbls = statGrid.querySelectorAll('.lbl');
  nums[0].textContent = regularMembers.length;
  nums[1].textContent = avgProgress + '%';
  nums[2].textContent = completedUsers.length;
  nums[3].textContent = surveySet.size;

  // メンバーリスト
  const list = document.getElementById('member-list');
  list.innerHTML = '';

  if (regularMembers.length === 0) {
    const div = document.createElement('div');
    div.style.cssText = 'text-align:center; color:var(--text-muted); padding:16px; font-size:14px;';
    div.textContent = 'メンバーがいません';
    list.appendChild(div);
    return;
  }

  regularMembers.sort((a, b) => (modulesBadgeByUser[b.id] || 0) - (modulesBadgeByUser[a.id] || 0));

  regularMembers.forEach(m => {
    const row = document.createElement('div');
    row.className = 'member-row';

    const avatar = document.createElement('div');
    avatar.className = 'member-avatar';
    avatar.textContent = m.name.charAt(0);

    const info = document.createElement('div');
    info.className = 'member-info';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = m.name;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = surveySet.has(m.id) ? 'アンケート済み' : 'アンケート未回答';
    info.append(name, meta);

    const prog = document.createElement('div');
    prog.className = 'member-prog';
    const modCount = modulesBadgeByUser[m.id] || 0;
    prog.textContent = modCount + ' / ' + MODULES.length + '完了';

    row.append(avatar, info, prog);
    list.appendChild(row);
  });
})();

async function loadInvite(companyId) {
  const section = document.getElementById('invite-section');
  const { data: invites } = await sb.from('invitations')
    .select('id, token, expires_at')
    .eq('company_id', companyId)
    .gt('expires_at', new Date().toISOString())
    .order('created_at', { ascending: false })
    .limit(1);

  const invite = invites?.[0];
  section.innerHTML = '';

  if (invite) {
    const base = location.href.replace('admin.html', '');
    const url = `${base}register.html?token=${invite.token}`;
    const expiry = new Date(invite.expires_at).toLocaleDateString('ja-JP');

    const label = document.createElement('div');
    label.style.cssText = 'font-size:13px; color:var(--text-muted); margin-bottom:4px;';
    label.textContent = `有効期限: ${expiry}`;

    const urlBox = document.createElement('div');
    urlBox.className = 'invite-url-box';
    urlBox.textContent = url;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-primary';
    copyBtn.textContent = 'URLをコピー';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(url);
      copyBtn.textContent = 'コピーしました！';
      setTimeout(() => { copyBtn.textContent = 'URLをコピー'; }, 2000);
    };

    const revokeBtn = document.createElement('button');
    revokeBtn.className = 'btn btn-outline';
    revokeBtn.textContent = '無効にする';
    revokeBtn.onclick = async () => {
      if (revokeBtn.dataset.confirm !== 'yes') {
        revokeBtn.textContent = 'もう一度押すと無効化';
        revokeBtn.dataset.confirm = 'yes';
        setTimeout(() => { revokeBtn.textContent = '無効にする'; delete revokeBtn.dataset.confirm; }, 3000);
        return;
      }
      revokeBtn.disabled = true;
      await sb.from('invitations').delete().eq('id', invite.id);
      await loadInvite(companyId);
    };

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:8px; margin-top:4px;';
    actions.append(copyBtn, revokeBtn);
    section.append(label, urlBox, actions);

  } else {
    const noInvite = document.createElement('div');
    noInvite.style.cssText = 'color:var(--text-muted); font-size:13px; margin-bottom:12px;';
    noInvite.textContent = '有効な招待リンクはありません';

    const expiryLabel = document.createElement('label');
    expiryLabel.style.cssText = 'display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--text-muted);';
    expiryLabel.textContent = '有効期限';

    const expiryInput = document.createElement('input');
    expiryInput.type = 'date';
    expiryInput.style.cssText = 'width:100%; box-sizing:border-box; margin-bottom:12px;';
    const defaultExpiry = new Date();
    defaultExpiry.setDate(defaultExpiry.getDate() + 30);
    expiryInput.value = defaultExpiry.toISOString().split('T')[0];
    expiryInput.min = new Date().toISOString().split('T')[0];

    const errMsg = document.createElement('div');
    errMsg.style.cssText = 'color:var(--danger); font-size:12px; margin-top:8px; display:none;';

    const generateBtn = document.createElement('button');
    generateBtn.className = 'btn btn-primary';
    generateBtn.textContent = '招待リンクを発行する';
    generateBtn.onclick = async () => {
      generateBtn.disabled = true;
      generateBtn.textContent = '発行中...';
      errMsg.style.display = 'none';
      const expiresAt = new Date(expiryInput.value + 'T23:59:59+09:00');
      const { error } = await sb.from('invitations').insert({ company_id: companyId, expires_at: expiresAt.toISOString() });
      if (error) {
        generateBtn.disabled = false;
        generateBtn.textContent = '招待リンクを発行する';
        errMsg.textContent = '発行に失敗しました。もう一度お試しください。';
        errMsg.style.display = 'block';
        return;
      }
      await loadInvite(companyId);
    };

    section.append(noInvite, expiryLabel, expiryInput, generateBtn, errMsg);
  }
}

const feedbackTypes = { bug: '不具合', improvement: '改善', content: '講座拡充' };
const feedbackStatuses = {
  pending: '確認待ち', implementing: '実装中', in_review: 'PR確認中',
  completed: '対応済み', rejected: '見送り', failed: '要再確認'
};

async function loadFeedback(companyId) {
  const { data, error } = await sb.from('feedback_requests')
    .select('id, category, title, description, implementation_title, implementation_description, page_url, status, pull_request_url, created_at, edited_at, reporter:profiles!feedback_requests_user_id_fkey(name)')
    .eq('company_id', companyId)
    .order('created_at', { ascending: false });
  const list = document.getElementById('feedback-list');
  list.replaceChildren();
  if (error) {
    const div = document.createElement('div');
    div.className = 'card empty-state';
    div.textContent = 'リクエストを読み込めませんでした。';
    list.appendChild(div);
    return;
  }
  if (!data?.length) {
    const div = document.createElement('div');
    div.className = 'card empty-state';
    div.textContent = '新しいリクエストはありません。';
    list.appendChild(div);
    return;
  }
  data.forEach(item => {
    const card = document.createElement('article');
    card.className = 'card feedback-card';
    const head = document.createElement('div');
    head.className = 'feedback-head';
    const heading = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'feedback-title';
    title.textContent = item.title;
    const meta = document.createElement('div');
    meta.className = 'feedback-meta';
    meta.textContent = `${item.reporter?.name || '受講者'}・${new Date(item.created_at).toLocaleString('ja-JP')}・${feedbackStatuses[item.status] || item.status}`;
    heading.append(title, meta);
    const type = document.createElement('span');
    type.className = 'type-pill';
    type.textContent = feedbackTypes[item.category] || item.category;
    head.append(heading, type);

    const original = document.createElement('div');
    original.className = 'feedback-original';
    const originalLabel = document.createElement('div');
    originalLabel.className = 'feedback-label';
    originalLabel.textContent = '受講者からの原文（変更されません）';
    const originalTitle = document.createElement('div');
    originalTitle.className = 'feedback-title';
    originalTitle.textContent = item.title;
    const body = document.createElement('div');
    body.className = 'feedback-body';
    body.textContent = item.description;
    original.append(originalLabel, originalTitle, body);
    card.append(head, original);

    if (item.status === 'pending' || item.status === 'failed') {
      const editor = document.createElement('div');
      editor.className = 'feedback-editor';
      const editorTitle = document.createElement('div');
      editorTitle.className = 'feedback-editor-title';
      editorTitle.textContent = '実装用の指示を編集';
      const editorHelp = document.createElement('div');
      editorHelp.className = 'feedback-editor-help';
      editorHelp.textContent = '受講者の意図を、どこを・どのように直すかが伝わる具体的な指示に整えてから承認してください。';
      const titleLabel = document.createElement('label');
      titleLabel.textContent = '実装用タイトル';
      const instructionTitle = document.createElement('input');
      instructionTitle.type = 'text';
      instructionTitle.maxLength = 120;
      instructionTitle.required = true;
      instructionTitle.value = item.implementation_title || item.title;
      const descriptionLabel = document.createElement('label');
      descriptionLabel.textContent = '実装内容・完了条件';
      const instructionDescription = document.createElement('textarea');
      instructionDescription.maxLength = 4000;
      instructionDescription.required = true;
      instructionDescription.value = item.implementation_description || item.description;
      editor.append(
        editorTitle,
        editorHelp,
        titleLabel,
        instructionTitle,
        descriptionLabel,
        instructionDescription
      );
      card.appendChild(editor);

      const actions = document.createElement('div');
      actions.className = 'feedback-actions';
      const approve = document.createElement('button');
      approve.className = 'btn btn-primary';
      approve.textContent = '編集内容を承認して実装へ';
      const reject = document.createElement('button');
      reject.className = 'btn btn-outline';
      reject.textContent = '見送る';
      const actionStatus = document.createElement('div');
      actionStatus.className = 'feedback-action-status';
      approve.onclick = () => decideFeedback(item.id, 'approve', approve, actionStatus, {
        title: instructionTitle.value,
        description: instructionDescription.value
      });
      reject.onclick = () => decideFeedback(item.id, 'reject', reject, actionStatus);
      actions.append(approve, reject);
      card.append(actions, actionStatus);
    } else if (item.implementation_title && item.implementation_description) {
      const approved = document.createElement('div');
      approved.className = 'feedback-approved';
      const approvedLabel = document.createElement('div');
      approvedLabel.className = 'feedback-label';
      approvedLabel.textContent = '承認した実装指示';
      const approvedTitle = document.createElement('div');
      approvedTitle.className = 'feedback-title';
      approvedTitle.textContent = item.implementation_title;
      const approvedBody = document.createElement('div');
      approvedBody.className = 'feedback-body';
      approvedBody.textContent = item.implementation_description;
      approved.append(approvedLabel, approvedTitle, approvedBody);
      card.appendChild(approved);
    }
    if (item.pull_request_url) {
      const link = document.createElement('a');
      link.className = 'status-link';
      link.href = item.pull_request_url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = '実装PRを確認する →';
      card.appendChild(link);
    }
    list.appendChild(card);
  });
}

async function decideFeedback(id, action, button, status, instruction = null) {
  const implementationTitle = instruction?.title.trim() || '';
  const implementationDescription = instruction?.description.trim() || '';
  if (action === 'approve' && (!implementationTitle || !implementationDescription)) {
    status.textContent = '実装用タイトルと実装内容の両方を入力してください。';
    return;
  }
  const actionButtons = [...button.parentElement.querySelectorAll('button')];
  actionButtons.forEach(actionButton => { actionButton.disabled = true; });
  status.textContent = '';
  const original = button.textContent;
  button.textContent = action === 'approve' ? '実装を依頼中...' : '処理中...';
  const { data: { session } } = await sb.auth.getSession();
  const { data, error } = await sb.functions.invoke('feedback-approve', {
    headers: { Authorization: `Bearer ${session.access_token}` },
    body: {
      id,
      action,
      implementation_title: implementationTitle,
      implementation_description: implementationDescription
    }
  });
  if (error || !data?.ok) {
    actionButtons.forEach(actionButton => { actionButton.disabled = false; });
    button.textContent = original;
    status.textContent = data?.error === 'Invalid implementation instructions'
      ? '実装指示はタイトル120文字以内、内容4000文字以内で入力してください。'
      : '処理できませんでした。もう一度お試しください。';
    return;
  }
  const { data: profile } = await sb.from('profiles').select('company_id').eq('id', session.user.id).single();
  await loadFeedback(profile.company_id);
}

document.getElementById('logout-btn').onclick = async () => {
  await sb.auth.signOut();
  location.href = 'index.html';
};
</script>
</body>
</html>
